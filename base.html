				<h1>日本犬たち</h1>
				<p>日本犬の6仲間（柴、秋田、紀州、四国、北海道、甲斐）は、昔から日本の山々で猟師さんと一緒に駆け回ってきた、とっても勇敢で一途なワンちゃんたちです。

				ピンと立った耳とくるんと巻いた尻尾がチャームポイントで、「この人！」と決めた飼い主さんを一生全力で愛し抜く、熱いハートの持ち主ばかり。

				素朴な佇まいには、どこかホッとするような日本ならではの魅力が詰まっています。
				日本の風土に適応した「生きた文化遺産」として、現在は家庭犬としても世界中で愛されています。<br>
